# PoodleChat permissions
# Load from server.cfg with:
# exec cfg/poodlechat_permissions.cfg
#
# ACE stays the baseline permission system for PoodleChat.
# If Config.moderation.permissions.qbcore.enabled = true in shared/config.lua,
# matching QBCore permissions can also grant staff/delete access without extra ACE rules.

# Channel access
add_ace group.admin chat.staffChannel allow
add_ace group.mod chat.staffChannel allow

# Manager panel
add_ace group.admin chat.manager allow

# Moderation
# Default delete and view-deleted behavior both use chat.deleteMessage.
add_ace group.admin chat.deleteMessage allow
add_ace group.mod chat.deleteMessage allow

# If you changed Config.moderation.permissions.viewDeletedAce to a different node,
# uncomment and adjust this line:
# add_ace group.admin chat.viewDeletedMessage allow

# Example principals
# Replace the identifiers below with your real principals if you are not already
# assigning them elsewhere in your server.cfg or permission manager.
#
# add_principal identifier.license:REPLACE_WITH_LICENSE group.admin
# add_principal identifier.fivem:REPLACE_WITH_FIVEM_ID group.mod
#
# txAdmin / framework group mappings can stay where they already live.
